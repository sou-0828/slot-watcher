<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日付設定">
<title>日付設定</title>
<style>
  :root {
    --bg: #111317; --card: #1b1e24; --line: #2a2e36; --text: #e8eaed;
    --sub: #8b919c; --accent: #4f8cff; --accent-soft: #233a66;
    --sat: #6ea8ff; --sun: #ff7b7b; --ok: #3ecf8e; --ng: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 20px 0 4px; }
  .lead { color: var(--sub); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .month-head { margin-bottom: 10px; }
  .month-title { font-size: 17px; font-weight: 600; }
  .nav { background: none; border: 1px solid var(--line); color: var(--text); width: 40px; height: 36px; border-radius: 10px; font-size: 18px; }
  .nav:disabled { opacity: .3; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: var(--sub); padding: 4px 0; }
  .dow.sat { color: var(--sat); } .dow.sun { color: var(--sun); }
  .day { aspect-ratio: 1; border: none; border-radius: 10px; background: transparent; color: var(--text); font-size: 15px; font-weight: 500; }
  .day.sat { color: var(--sat); } .day.sun { color: var(--sun); }
  .day.past { color: #444a55; }
  .day.today { box-shadow: inset 0 0 0 1px var(--sub); }
  .day.sel { background: var(--accent); color: #fff; }
  .day:not(.past):not(.sel):active { background: var(--accent-soft); }
  .summary { font-size: 14px; line-height: 1.6; min-height: 22px; word-break: break-all; }
  .muted { color: var(--sub); font-size: 12px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 15px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; }
  .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a3f48; border-radius: 30px; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--ok); }
  .switch input:checked + .slider:before { transform: translateX(22px); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2b2f37; color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .toast.ok { box-shadow: inset 3px 0 0 var(--ok); } .toast.ng { box-shadow: inset 3px 0 0 var(--ng); }
  details summary { cursor: pointer; font-size: 14px; color: var(--sub); }
  input[type=password] { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font-size: 15px; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>日付設定</h1>
  <p class="lead">行きたい日をタップして「保存」。反映は次のチェック（最大15分後）から。</p>

  <div class="card" id="setupCard">
    <details id="setup">
      <summary>🔑 トークン設定</summary>
      <p class="muted">GitHubで作ったトークン（github_pat_…）を貼り付けて保存。このスマホのブラウザにだけ保存されます。</p>
      <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
      <div class="btns">
        <button class="btn" id="forget">削除</button>
        <button class="btn primary" id="saveToken">保存</button>
      </div>
    </details>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div style="font-weight:600">チェック</div>
        <div class="muted" id="watchLabel">読み込み中…</div>
      </div>
      <label class="switch"><input type="checkbox" id="watch" disabled><span class="slider"></span></label>
    </div>
  </div>

  <div class="card">
    <div class="row month-head">
      <button class="nav" id="prev" aria-label="前の月">‹</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="nav" id="next" aria-label="次の月">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">選んだ日</div>
    <div class="summary" id="summary"></div>
    <div class="btns">
      <button class="btn" id="clear">全部外す</button>
      <button class="btn primary" id="save" disabled>保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const OWNER = "sou-0828";
const REPO = "slot-watcher";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/actions/variables`;
const MAX_MONTHS_AHEAD = 9;
const DOW = ["日","月","火","水","木","金","土"];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = new Date(); today.setHours(0,0,0,0);

let selected = new Set();
let savedValue = "";
let view = new Date(today.getFullYear(), today.getMonth(), 1);

// ---------- トークン（このブラウザだけに保存） ----------
function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch { return ""; } }
function setToken(t) { try { t ? localStorage.setItem("gh_token", t) : localStorage.removeItem("gh_token"); } catch {} }

// ---------- GitHub API ----------
async function gh(method, path = "", body) {
  const res = await fetch(API + path, {
    method,
    headers: {
      "Authorization": `Bearer ${getToken()}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(body ? {"Content-Type": "application/json"} : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401 || res.status === 403) throw new Error("auth");
  return res;
}
async function readVar(name) {
  const res = await gh("GET", "/" + name);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("http " + res.status);
  return (await res.json()).value;
}
async function writeVar(name, value) {
  if (value === "") {
    const res = await gh("DELETE", "/" + name);
    if (!res.ok && res.status !== 404) throw new Error("http " + res.status);
    return;
  }
  let res = await gh("PATCH", "/" + name, { name, value });
  if (res.status === 404) res = await gh("POST", "", { name, value });
  if (!res.ok) throw new Error("http " + res.status);
}

// ---------- 日付の文字列 ⇄ セット ----------
function parseValue(raw) {
  const out = new Set();
  if (!raw) return out;
  const one = s => {
    const p = s.trim().replace(/-/g, "/").split("/").map(Number);
    if (p.length === 3) return new Date(p[0], p[1]-1, p[2]);
    let d = new Date(today.getFullYear(), p[0]-1, p[1]);
    if (d < today) d = new Date(today.getFullYear()+1, p[0]-1, p[1]);
    return d;
  };
  raw.replace(/、/g, ",").replace(/～/g, "~").split(",").forEach(tok => {
    tok = tok.trim(); if (!tok) return;
    if (tok.includes("~")) {
      const [a, b] = tok.split("~").map(one);
      for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) out.add(iso(d));
    } else out.add(iso(one(tok)));
  });
  return out;
}
function toValue(set) {
  // 連続した日は「開始~終了」にまとめる
  const days = [...set].filter(s => fromIso(s) >= today).sort();
  const parts = [];
  let i = 0;
  while (i < days.length) {
    let j = i;
    while (j + 1 < days.length && Math.round((fromIso(days[j+1]) - fromIso(days[j])) / 864e5) === 1) j++;
    parts.push(i === j ? days[i] : `${days[i]}~${days[j]}`);
    i = j + 1;
  }
  return parts.join(", ");
}

// ---------- 画面 ----------
function render() {
  $("monthTitle").textContent = `${view.getFullYear()}年 ${view.getMonth()+1}月`;
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  const last = new Date(today.getFullYear(), today.getMonth() + MAX_MONTHS_AHEAD, 1);
  $("prev").disabled = view <= first;
  $("next").disabled = view >= last;

  const g = $("grid"); g.innerHTML = "";
  DOW.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = "dow" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
    el.textContent = w; g.appendChild(el);
  });
  for (let i = 0; i < view.getDay(); i++) g.appendChild(document.createElement("div"));
  const daysIn = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  for (let d = 1; d <= daysIn; d++) {
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const key = iso(date);
    const w = date.getDay();
    const b = document.createElement("button");
    b.className = "day" + (w === 0 ? " sun" : w === 6 ? " sat" : "")
      + (date < today ? " past" : "") + (+date === +today ? " today" : "")
      + (selected.has(key) ? " sel" : "");
    b.textContent = d;
    b.disabled = date < today;
    b.onclick = () => { selected.has(key) ? selected.delete(key) : selected.add(key); render(); };
    g.appendChild(b);
  }
  renderSummary();
}
function renderSummary() {
  const v = toValue(selected);
  $("summary").innerHTML = v
    ? v.split(", ").map(p => p.split("~").map(s => {
        const d = fromIso(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
      }).join("〜")).join("、")
    : '<span class="muted">未選択（＝全部の日の空きを通知）</span>';
  $("save").disabled = !getToken() || v === savedValue;
  $("save").textContent = v === savedValue ? "保存済み" : "保存";
}
function toast(msg, kind = "ok") {
  const t = $("toast"); t.textContent = msg; t.className = `toast show ${kind}`;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.className = "toast", 2600);
}
function handleError(e) {
  if (e.message === "auth") { toast("トークンが無効です。設定し直してください", "ng"); $("setupCard").classList.remove("hidden"); $("setup").open = true; }
  else toast("通信エラー。もう一度試してください", "ng");
}

// ---------- 読み込み ----------
async function load() {
  if (!getToken()) {
    $("setup").open = true;
    $("watchLabel").textContent = "トークン未設定";
    render(); return;
  }
  try {
    const [dates, watch] = await Promise.all([readVar("TARGET_DATES"), readVar("WATCH_ENABLED")]);
    selected = parseValue(dates || "");
    savedValue = toValue(selected);
    $("watch").checked = watch === "true";
    $("watch").disabled = false;
    $("watchLabel").textContent = watch === "true" ? "15分おきに確認中" : "停止中";
    $("setupCard").classList.add("hidden");
  } catch (e) { handleError(e); $("watchLabel").textContent = "読み込み失敗"; }
  render();
}

// ---------- ボタン ----------
$("prev").onclick = () => { view.setMonth(view.getMonth()-1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth()+1); render(); };
$("clear").onclick = () => { selected.clear(); render(); };
$("save").onclick = async () => {
  $("save").disabled = true;
  try {
    const v = toValue(selected);
    await writeVar("TARGET_DATES", v);
    savedValue = v; toast("✅ 保存しました");
  } catch (e) { handleError(e); }
  renderSummary();
};
$("watch").onchange = async e => {
  const on = e.target.checked;
  e.target.disabled = true;
  try {
    await writeVar("WATCH_ENABLED", on ? "true" : "false");
    $("watchLabel").textContent = on ? "15分おきに確認中" : "停止中";
    toast(on ? "✅ チェックを開始しました" : "⏸ チェックを止めました");
  } catch (err) { e.target.checked = !on; handleError(err); }
  e.target.disabled = false;
};
$("saveToken").onclick = () => {
  const t = $("token").value.trim();
  if (!t) return;
  setToken(t); $("token").value = ""; toast("トークンを保存しました"); load();
};
$("forget").onclick = () => { setToken(""); toast("トークンを削除しました"); location.reload(); };

load();
</script>
</body>
</html>
