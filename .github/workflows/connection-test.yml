name: connection-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: check
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then echo "NG: TARGET_URL未設定"; exit 1; fi
          set +e
          RESULT=$(curl -sS -L --max-time 20 -o page.html -w "%{http_code} %{time_total}" "$TARGET_URL" 2>err.txt)
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then echo "NG: 接続失敗 (curl $CODE)"; cat err.txt; exit 1; fi
          echo "HTTP: $RESULT"
          if grep -qi "password" page.html; then echo "OK: ログイン画面に届いた"; else echo "WARN: ログイン画面じゃない"; exit 1; fi
